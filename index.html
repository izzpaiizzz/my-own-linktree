<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Own Linktree</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <script src="script.js"></script>
  <div class="card">
    <img src="profile.png" class="profile-img" alt="Profile Picture">
    <h1>Faiz Syaiful Wafa</h1>
    <h2 id="typing-text"></h2>
    <div class="links">
      <a href="https://www.instagram.com/izzpaiizzz" target="_blank" class="btn instagram">
        <i class="fab fa-instagram"></i>
        <span>Instagram</span>
      </a>
      <a href="https://youtube.com/@izzpaiiiizzzz" target="_blank" class="btn youtube">
        <i class="fab fa-youtube"></i>
        <span>Youtube</span>
      </a>
      <a href="https://wa.me/6287821461018" target="_blank" class="btn whatsapp">
        <i class="fab fa-whatsapp"></i>
        <span>Contact</span>
      </a>
    </div>
    
    <div class="footer-links">
      <a href="https://buymeacoffee.com/izzpaiizzz" target="_blank" title="Blog">
        <i class="fas fa-coffee"></i>
      </a>
      <a href="https://github.com/izzpaiizzz" target="_blank" title="GitHub Repository">
        <i class="fab fa-github"></i>
      </a>
    </div>
  </div>
</body>
</html>
